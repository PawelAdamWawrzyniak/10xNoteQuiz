name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  deployments: write

jobs:
  # Job 1: Lintowanie i testowanie
  quality_checks:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

  # Job 2: Budowanie i wdrażanie
  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: quality_checks
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=10xnotequiz --branch=master
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-build
          path: dist

  # Job 2: Deploy the built application to Cloudflare
  deploy_to_cloudflare:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build_and_deploy
    environment:
      name: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-build
          path: dist

      # --- ADD THIS STEP FOR DEBUGGING ---
      - name: List files in the deployment directory
        run: ls -R dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # This command is now correct and robust
          command: pages deploy dist --project-name=10xnotequiz --branch=master
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
